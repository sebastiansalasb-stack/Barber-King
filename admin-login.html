<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barber King - Acceso Administrador</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body>

  <a href="#main-contenido" class="enlace-saltar">Saltar al contenido principal</a>

  <header class="header">
    <div class="marca">
      <svg class="icono-marca" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="6" cy="6" r="3"></circle>
        <circle cx="6" cy="18" r="3"></circle>
        <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
        <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
        <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
      </svg>
      <h1>Barber King</h1>
    </div>
  </header>

  <main id="main-contenido" class="main main--centrado" tabindex="-1">
    <section class="tarjeta-login">
      <h2>Panel de Administrador</h2>
      <p class="subtitulo-legal">Acceso exclusivo para el personal de la barbería.</p>

      <form id="form-admin-login" novalidate>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username" required>
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
        </div>

        <p id="mensaje-error-admin-login" class="mensaje-error" role="alert" aria-live="assertive" hidden></p>

        <button type="submit">Iniciar Sesión</button>
      </form>

      <p class="enlace-secundario">
        ¿Eres cliente? <a href="index.html">Inicia sesión aquí</a>
      </p>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Barber King - Proyecto Desarrollo de Aplicaciones Móviles</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
